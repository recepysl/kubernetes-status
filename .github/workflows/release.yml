name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$PLIST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
            exit 1
          fi

      - name: Self-check
        run: swift run KubernetesStatus --selftest

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Zip app
        run: ditto -c -k --keepParent KubernetesStatus.app "dist/KubernetesStatus-${GITHUB_REF_NAME#v}.zip"

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[[0-9]/ { p = 0 } p' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** `curl -fsSL https://raw.githubusercontent.com/recepysl/kubernetes-status/main/scripts/install.sh | bash`

          Or download the DMG and drag *Kubernetes Status* to Applications. The build is ad-hoc signed, not notarized: if macOS says it *could not verify* the app, click **Done**, then **System Settings → Privacy & Security → Open Anyway**.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "Kubernetes Status ${GITHUB_REF_NAME#v}" --notes-file notes.md
